name: Validate shopping pipeline
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install polars==1.38.1
      - run: docker build -t shopping .
      - name: Official fixtures
        run: python scripts/run_fixtures.py fixtures -- python scripts/run_container.py
      - name: Generate official seed-1 dev set
        run: cargo run --release --manifest-path generator/Cargo.toml -- --seed 1 --events 1000000 --clicks 250000 --output dev
      - name: Dev run under scorer limits
        run: mkdir -p output scratch && chmod 777 output scratch && /usr/bin/time -v docker run --rm --network none --cpus 8 --memory 24g --memory-swap 24g --read-only --tmpfs /tmp:rw,size=64m --user 1000:1000 -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e NCPU=8 -e MEM_GB=24 -v "$PWD/dev:/data:ro" -v "$PWD/output:/output" -v "$PWD/scratch:/scratch" shopping
      - run: python scripts/compare.py output dev-answer
